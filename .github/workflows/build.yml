name: Build

on:
  push:
    branches:
      - main
      - fix4-rc6
      - pip12h4-hotfix8
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - fix4-rc6
      - pip12h4-hotfix8

jobs:
  build-wpf:
    name: WPF Host App (.NET 8, Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore ./src/PiPManager.sln
        continue-on-error: true  # solution may not exist on all branches

      - name: Build
        run: dotnet build ./src/PiPManager.sln -c Release --no-restore
        continue-on-error: true

      - name: Run tests
        run: dotnet test ./src/PiPManager.Tests -c Release --no-build --verbosity normal
        continue-on-error: true

      - name: Publish self-contained executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish ./src/PiPManager/PiPManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o ./dist/wpf

      - name: Upload WPF artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PiPManager-WPF-${{ github.ref_name }}
          path: ./dist/wpf/

  build-extension:
    name: Firefox Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Lint extension
        run: web-ext lint --source-dir ./extension
        continue-on-error: true  # extension directory may not exist on all branches

      - name: Build extension
        run: web-ext build --source-dir ./extension --artifacts-dir ./dist/extension
        continue-on-error: true

      - name: Upload extension artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: PiPManager-Extension-${{ github.ref_name }}
          path: ./dist/extension/

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-wpf, build-extension]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WPF artifact
        uses: actions/download-artifact@v4
        with:
          name: PiPManager-WPF-${{ github.ref_name }}
          path: ./dist/wpf/
        continue-on-error: true

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: PiPManager-Extension-${{ github.ref_name }}
          path: ./dist/extension/
        continue-on-error: true

      - name: Create release archive
        run: |
          zip -r PiPManager-WPF-${{ github.ref_name }}.zip ./dist/wpf/ 2>/dev/null || true
          zip -r PiPManager-Extension-${{ github.ref_name }}.zip ./dist/extension/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PiPManager-WPF-${{ github.ref_name }}.zip
            PiPManager-Extension-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
